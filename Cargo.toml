[package]
name = "summoner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A gamified terminal session manager for Claude Code"
repository = "https://github.com/sisalik/summoner"
license = "MIT"
readme = "README.md"
# Not publishable as it stands: crates.io ignores [patch], so a published
# summoner would resolve vt100 to upstream, which lacks the stream-row and
# OSC 8 APIs the selection code is built on.
publish = false

[features]
default = []
dev-creature = ["dep:png"]

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
nucleo-matcher = "0.3"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
unicode-width = "0.2"
png = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3"

# Local vt100 fork adding stream-row accessors (see vendor/vt100/README.md).
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
