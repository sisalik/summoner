[package]
name = "summoner"
version = "0.1.0"
edition = "2024"
description = "A gamified terminal session manager for Claude Code"

[dependencies]
anyhow = "1"
crossterm = "0.29"
nucleo-matcher = "0.3"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
